<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IIIT Pune • Academic Attendance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --surface: rgba(15, 23, 42, 0.65);
      --surface-elevated: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(56, 189, 248, 0.45);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --danger: #f43f5e;
      --danger-glow: rgba(244, 63, 94, 0.2);
      --warning: #f59e0b;
      --warning-glow: rgba(245, 158, 11, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 45%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.5) 0px, transparent 100%);
      color: var(--text-main);
      padding: 32px 20px 80px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    /* Top Navigation / Branding */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-sec {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      font-weight: 700;
    }
    .date-pill {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    /* Hero Dashboard Banner */
    .hero-banner {
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 32px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 36px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    .hero-banner::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Radial Gauge */
    .gauge-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gauge-svg {
      transform: rotate(-90deg);
      width: 130px;
      height: 130px;
    }
    .gauge-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 9;
    }
    .gauge-val {
      fill: none;
      stroke-width: 9;
      stroke-linecap: round;
      stroke-dasharray: 339.29;
      stroke-dashoffset: 339.29;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s ease;
    }
    .gauge-text {
      position: absolute;
      text-align: center;
    }
    .gauge-pct {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      font-family: 'JetBrains Mono', monospace;
    }
    .gauge-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    /* Hero Metrics Grid */
    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px;
    }
    .hero-stat-card {
      background: rgba(9, 13, 22, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 12px 16px;
    }
    .hero-stat-num {
      font-size: 1.35rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-main);
      margin-bottom: 2px;
    }
    .hero-stat-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    /* Filter & Controls Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .filter-pills {
      display: flex;
      gap: 8px;
      background: var(--surface);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active {
      background: var(--surface-elevated);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .filter-btn:hover:not(.active) { color: var(--text-main); }

    /* Subject Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    .card:hover {
      border-color: var(--border-focus);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.5);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
    }
    .card-pct {
      font-size: 1.45rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.5px;
    }

    .status-safe { color: var(--success); }
    .status-warning { color: var(--warning); }
    .status-danger { color: var(--danger); }

    /* Progress bar */
    .bar-track {
      background: rgba(9, 13, 22, 0.8);
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
    }

    /* Spec stats breakdown */
    .spec-stats {
      background: rgba(9, 13, 22, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .spec-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-weight: 500;
    }
    .spec-row strong {
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }
    .spec-row-accent {
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      padding-top: 6px;
      color: var(--accent);
    }
    .spec-row-accent strong { color: var(--accent); }

    /* Advice box */
    .advice-box {
      background: rgba(9, 13, 22, 0.7);
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 10px 12px;
      font-size: 0.78rem;
      line-height: 1.45;
      min-height: 48px;
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      color: #cbd5e1;
    }
    .advice-box.danger-edge { border-left-color: var(--danger); }
    .advice-box.safe-edge { border-left-color: var(--success); }

    /* Interaction Controllers */
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quick-mark-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-quick {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-quick-p {
      background: var(--success-glow);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }
    .btn-quick-p:hover {
      background: rgba(16, 185, 129, 0.35);
      transform: translateY(-1px);
    }
    .btn-quick-a {
      background: var(--danger-glow);
      color: var(--danger);
      border-color: rgba(244, 63, 94, 0.3);
    }
    .btn-quick-a:hover {
      background: rgba(244, 63, 94, 0.35);
      transform: translateY(-1px);
    }

    .adjust-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 13, 22, 0.35);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    .adjust-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .btn-stepper {
      display: flex;
      gap: 4px;
    }
    .btn-circle {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .btn-bunk-ctrl { background: var(--danger-glow); color: var(--danger); border-color: rgba(244, 63, 94, 0.25); }
    .btn-extra-ctrl { background: var(--accent-glow); color: var(--accent); border-color: rgba(56, 189, 248, 0.25); }
    .btn-circle:hover { transform: translateY(-1px); opacity: 0.9; }

    @media (max-width: 768px) {
      .hero-banner { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 20px; }
      .hero-metrics { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand-title">
        IIIT PUNE <span class="badge-sec">SEC D • G10</span>
      </div>
      <div class="date-pill">
        <span class="pulse-dot"></span>
        <span id="header-date">Loading...</span>
      </div>
    </div>

    <!-- Hero Overall Banner -->
    <div class="hero-banner">
      <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 120 120">
          <circle class="gauge-bg" cx="60" cy="60" r="54"></circle>
          <circle id="gauge-circle" class="gauge-val" cx="60" cy="60" r="54"></circle>
        </svg>
        <div class="gauge-text">
          <div id="hero-pct" class="gauge-pct">0%</div>
          <div class="gauge-label">Overall</div>
        </div>
      </div>

      <div class="hero-metrics">
        <div class="hero-stat-card">
          <div id="hero-attended" class="hero-stat-num">0</div>
          <div class="hero-stat-title">Attended So Far</div>
        </div>
        <div class="hero-stat-card">
          <div id="hero-held" class="hero-stat-num">0</div>
          <div class="hero-stat-title">Total Held So Far</div>
        </div>
        <div class="hero-stat-card">
          <div id="hero-bunk-buffer" class="hero-stat-num" style="color: var(--success);">0</div>
          <div class="hero-stat-title">Safe Bunk Buffer</div>
        </div>
        <div class="hero-stat-card">
          <div id="hero-sem-total" class="hero-stat-num" style="color: var(--accent);">0</div>
          <div class="hero-stat-title">Semester Total</div>
        </div>
      </div>
    </div>

    <!-- Toolbar Filters -->
    <div class="toolbar">
      <div class="filter-pills">
        <button class="filter-btn active" onclick="setFilter('all')">All Courses</button>
        <button class="filter-btn" onclick="setFilter('danger')">Needs Focus (<75%)</button>
        <button class="filter-btn" onclick="setFilter('theory')">Lectures</button>
        <button class="filter-btn" onclick="setFilter('lab')">Labs & Tut</button>
      </div>
    </div>

    <!-- Cards Grid -->
    <div class="grid" id="card-grid"></div>

  </div>

  <script>
    // Group 10 Schedule
    const scheduleByDay = {
      1: ["bee", "cpcp", "beelab", "et", "iks"],
      2: ["evs", "cde", "et"],
      3: ["lws", "bee", "cpcp", "cde", "et"],
      4: [],
      5: ["cde", "cpcp", "cpcplab", "bee", "cdetut", "lws"]
    };

    const holidayList = [
      "2026-08-26", "2026-09-14", "2026-10-02", "2026-10-19",
      "2026-10-20", "2026-11-08", "2026-11-24", "2026-12-25"
    ];

    const courseCatalog = {
      "bee": { name: "BEE", type: "theory", desc: "Basic Electronics Eng." },
      "cpcp": { name: "CPCP", type: "theory", desc: "Computer Programming Concepts" },
      "cde": { name: "CDE", type: "theory", desc: "Calculus & Diff Equations" },
      "et": { name: "ET", type: "theory", desc: "Emerging Technologies" },
      "evs": { name: "EVS", type: "theory", desc: "Environmental Science" },
      "lws": { name: "LWS", type: "theory", desc: "Language & Writing Skills" },
      "iks": { name: "IKS", type: "theory", desc: "Indian Knowledge System" },
      "cdetut": { name: "CDE Tutorial", type: "lab", desc: "Tutorial Session" },
      "beelab": { name: "BEE Lab", type: "lab", desc: "Group 10 (Mondays)" },
      "cpcplab": { name: "CPCP Lab", type: "lab", desc: "Group 10 (Fridays)" }
    };

    const semStartDate = new Date(2026, 7, 20); // Aug 20, 2026
    const semEndDate = new Date(2026, 11, 4);   // Dec 04, 2026

    let adjustments = JSON.parse(localStorage.getItem('iiit_d_g10_adjustments')) || {
      bunks: { "iks": 1 },
      extraAttended: {}
    };

    let activeFilter = 'all';

    function setFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      calculateAndRender();
    }

    function saveAdjustments() {
      localStorage.setItem('iiit_d_g10_adjustments', JSON.stringify(adjustments));
      calculateAndRender();
    }

    function calculateAndRender() {
      const now = new Date();
      document.getElementById('header-date').textContent = now.toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
      });

      const heldCounts = {};
      const semTotalCounts = {};
      Object.keys(courseCatalog).forEach(k => {
        heldCounts[k] = 0;
        semTotalCounts[k] = 0;
      });

      // 1. Calculate Full Semester Totals
      let iterSem = new Date(semStartDate);
      while (iterSem <= semEndDate) {
        const dStr = iterSem.toISOString().split('T')[0];
        const day = iterSem.getDay();
        if (!holidayList.includes(dStr) && scheduleByDay[day]) {
          scheduleByDay[day].forEach(key => {
            if (semTotalCounts[key] !== undefined) semTotalCounts[key]++;
          });
        }
        iterSem.setDate(iterSem.getDate() + 1);
      }

      // 2. Calculate Held Up To Today
      let iterToday = new Date(semStartDate);
      const todayCutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      while (iterToday <= todayCutoff && iterToday <= semEndDate) {
        const dStr = iterToday.toISOString().split('T')[0];
        const day = iterToday.getDay();
        if (!holidayList.includes(dStr) && scheduleByDay[day]) {
          scheduleByDay[day].forEach(key => {
            if (heldCounts[key] !== undefined) heldCounts[key]++;
          });
        }
        iterToday.setDate(iterToday.getDate() + 1);
      }

      let totalAttAll = 0, totalHeldAll = 0, totalSemAll = 0;
      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';

      Object.keys(courseCatalog).forEach(subKey => {
        const item = courseCatalog[subKey];
        const schedHeld = heldCounts[subKey];
        const schedSem = semTotalCounts[subKey];
        const bunks = adjustments.bunks[subKey] || 0;
        const extraAtt = adjustments.extraAttended[subKey] || 0;

        const totalHeld = schedHeld + extraAtt;
        const attended = Math.max(0, schedHeld - bunks) + extraAtt;
        const finalSem = schedSem + extraAtt;
        const targetPass = Math.ceil(0.75 * finalSem);

        totalAttAll += attended;
        totalHeldAll += totalHeld;
        totalSemAll += finalSem;

        const pct = totalHeld > 0 ? ((attended / totalHeld) * 100).toFixed(1) : 100;
        const isSafe = pct >= 75;

        // Apply filters
        if (activeFilter === 'danger' && isSafe) return;
        if (activeFilter === 'theory' && item.type !== 'theory') return;
        if (activeFilter === 'lab' && item.type !== 'lab') return;

        let adviceText = "";
        let adviceClass = isSafe ? "safe-edge" : "danger-edge";

        if (totalHeld === 0) {
          adviceText = `Semester starts with ${finalSem} lectures. Target ≥ ${targetPass}.`;
        } else if (isSafe) {
          const canBunk = Math.floor((attended - 0.75 * totalHeld) / 0.75);
          adviceText = canBunk === 0 
            ? "⚠️ Right at threshold. Attending the next lecture is critical." 
            : `🎉 Bunk Buffer: You can safely miss <strong>${canBunk}</strong> lecture${canBunk > 1 ? 's' : ''}.`;
        } else {
          const needed = Math.ceil((0.75 * totalHeld - attended) / 0.25);
          adviceText = `🚨 Criteria Alert: Must attend next <strong>${needed}</strong> lecture${needed > 1 ? 's' : ''} sequentially.`;
        }

        const statusColor = isSafe ? 'var(--success)' : 'var(--danger)';
        const statusClass = isSafe ? 'status-safe' : 'status-danger';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-top">
              <div>
                <div class="card-title">${item.name} <span class="card-badge">${item.type}</span></div>
                <div style="font-size: 0.72rem; color: var(--text-dim);">${item.desc}</div>
              </div>
              <div class="card-pct ${statusClass}">${pct}%</div>
            </div>

            <div class="bar-track">
              <div class="bar-fill" style="width: ${Math.min(pct, 100)}%; background-color: ${statusColor};"></div>
            </div>

            <div class="spec-stats">
              <div class="spec-row"><span>Attended / Held:</span> <strong>${attended} / ${totalHeld}</strong></div>
              <div class="spec-row"><span>Missed (Bunked):</span> <strong>${bunks}</strong></div>
              <div class="spec-row spec-row-accent">
                <span>Semester Requirement:</span> 
                <strong>≥ ${targetPass} / ${finalSem}</strong>
              </div>
            </div>

            <div class="advice-box ${adviceClass}">${adviceText}</div>
          </div>

          <div class="card-actions">
            <div class="quick-mark-row">
              <button class="btn-quick btn-quick-p" onclick="markPresent('${subKey}')">✓ Present</button>
              <button class="btn-quick btn-quick-a" onclick="markAbsent('${subKey}')">✗ Absent</button>
            </div>
            <div class="adjust-row">
              <span class="adjust-label">Missed Counter:</span>
              <div class="btn-stepper">
                <button class="btn-circle btn-bunk-ctrl" onclick="modifyBunk('${subKey}', -1)">-</button>
                <button class="btn-circle btn-bunk-ctrl" onclick="modifyBunk('${subKey}', 1)">+</button>
              </div>
            </div>
            <div class="adjust-row">
              <span class="adjust-label">Extra Classes:</span>
              <div class="btn-stepper">
                <button class="btn-circle btn-extra-ctrl" onclick="modifyExtra('${subKey}', -1)">-</button>
                <button class="btn-circle btn-extra-ctrl" onclick="modifyExtra('${subKey}', 1)">+</button>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      // Update Overall Summary & Radial Gauge
      const ovPct = totalHeldAll > 0 ? ((totalAttAll / totalHeldAll) * 100).toFixed(1) : 100;
      const totalSafeBunk = Math.max(0, Math.floor((totalAttAll - 0.75 * totalHeldAll) / 0.75));

      document.getElementById('hero-pct').textContent = ovPct + '%';
      document.getElementById('hero-attended').textContent = totalAttAll;
      document.getElementById('hero-held').textContent = totalHeldAll;
      document.getElementById('hero-bunk-buffer').textContent = totalSafeBunk;
      document.getElementById('hero-sem-total').textContent = totalSemAll;

      // Update SVG Circle Offset (Perimeter = 2 * PI * 54 = 339.29)
      const circle = document.getElementById('gauge-circle');
      const offset = 339.29 - (339.29 * (Math.min(ovPct, 100) / 100));
      circle.style.strokeDashoffset = offset;
      circle.style.stroke = ovPct >= 75 ? 'var(--success)' : 'var(--danger)';
      document.getElementById('hero-pct').className = 'gauge-pct ' + (ovPct >= 75 ? 'status-safe' : 'status-danger');
    }

    function markPresent(subKey) {
      if ((adjustments.bunks[subKey] || 0) > 0) {
        adjustments.bunks[subKey]--;
      } else {
        adjustments.extraAttended[subKey] = (adjustments.extraAttended[subKey] || 0) + 1;
      }
      saveAdjustments();
    }

    function markAbsent(subKey) {
      adjustments.bunks[subKey] = (adjustments.bunks[subKey] || 0) + 1;
      saveAdjustments();
    }

    function modifyBunk(subKey, change) {
      const current = adjustments.bunks[subKey] || 0;
      adjustments.bunks[subKey] = Math.max(0, current + change);
      saveAdjustments();
    }

    function modifyExtra(subKey, change) {
      const current = adjustments.extraAttended[subKey] || 0;
      adjustments.extraAttended[subKey] = Math.max(0, current + change);
      saveAdjustments();
    }

    calculateAndRender();
  </script>
</body>
</html>
